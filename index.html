<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. HKT Esports - Player Gateway</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#07070e',
                        cardbg: '#101120',
                        accent: '#FF3366',
                        accenthover: '#E62E5C',
                        borderline: '#1f223d',
                        bkash: '#E2136E',
                        nagad: '#F6921E'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        gaming: ['Orbitron', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex flex-col max-w-md mx-auto relative border-x border-borderline shadow-2xl pb-24">

    <div id="toast-container" class="flex flex-col gap-2"></div>

    <div id="auth-gate-screen" class="fixed inset-0 bg-darkbg z-[9999] flex flex-col p-6 max-w-md mx-auto border-x border-borderline overflow-y-auto">
        <div class="my-auto w-full flex flex-col gap-6 py-6">
            
            <div class="text-center relative">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-cardbg border border-accent/40 text-accent mb-3 shadow-xl shadow-accent/10">
                    <i class="fa-solid fa-gamepad text-4xl neon-text"></i>
                </div>
                <h1 class="font-gaming text-2xl font-black tracking-wider text-white">MR. HKT <span class="text-accent">ESPORTS</span></h1>
                <p class="text-[10px] text-slate-400 mt-1 uppercase font-mono">Player Authentication Protocol</p>
            </div>

            <div class="flex border-b border-borderline text-xs font-bold uppercase tracking-wider bg-cardbg/40 p-1 rounded-xl">
                <button id="btn-tab-login" onclick="toggleAuthMode('login')" class="flex-1 py-2.5 text-center text-accent border-b-2 border-accent transition-all rounded-lg">Signin</button>
                <button id="btn-tab-register" onclick="toggleAuthMode('register')" class="flex-1 py-2.5 text-center text-slate-500 hover:text-slate-300 transition-all rounded-lg">Register</button>
                <button id="btn-tab-preview" onclick="toggleAuthMode('preview')" class="flex-1 py-2.5 text-center text-slate-500 hover:text-slate-300 transition-all rounded-lg"><i class="fa-solid fa-eye mr-1"></i> Preview</button>
            </div>

            <div id="auth-subview-login" class="flex flex-col gap-4">
                <form id="form-login-gate" onsubmit="handleAccountLoginProcessing(event)" class="flex flex-col gap-3.5 text-xs font-bold">
                    <input type="email" id="login-email-field" placeholder="ACCOUNT EMAIL ADDRESS" class="w-full bg-cardbg border border-borderline rounded-xl px-4 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:border-accent transition" required>
                    
                    <div class="relative">
                        <input type="password" id="login-pass-field" placeholder="SECRET PASSKEY" class="w-full bg-cardbg border border-borderline rounded-xl pl-4 pr-11 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:border-accent transition" required>
                        <button type="button" onclick="togglePasswordVisibility('login-pass-field', 'login-eye-icon')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500">
                            <i id="login-eye-icon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <button type="submit" id="btn-login-submit" class="w-full bg-accent text-white py-4 rounded-xl uppercase tracking-wider text-xs font-black hover:bg-accenthover transition neon-pink-glow">
                        Sign In Profile
                    </button>
                </form>
            </div>

            <div id="auth-subview-register" class="flex flex-col gap-4 hidden">
                <form id="form-register-gate" onsubmit="handleAccountRegistrationProcessing(event)" class="flex flex-col gap-3 text-xs font-bold">
                    <input type="text" id="reg-name-field" placeholder="SOLDIER NAME" class="w-full bg-cardbg border border-borderline rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-accent" required>
                    <input type="email" id="reg-email-field" placeholder="EMAIL ADDRESS" class="w-full bg-cardbg border border-borderline rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-accent" required>
                    <input type="text" id="reg-ffuid-field" placeholder="FREE FIRE NUMERIC UID" class="w-full bg-cardbg border border-borderline rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-accent font-mono" required>
                    <input type="password" id="reg-pass-field" placeholder="PASSWORD" class="w-full bg-cardbg border border-borderline rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-accent" required>

                    <button type="submit" id="btn-register-submit" class="w-full bg-accent text-white py-4 rounded-xl uppercase tracking-wider text-xs font-black hover:bg-accenthover transition neon-pink-glow mt-1">
                        Register Account
                    </button>
                </form>
            </div>

        </div>
    </div>

    <header class="bg-cardbg/80 backdrop-blur-md border-b border-borderline p-4 sticky top-0 z-40 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
            <span class="relative flex h-2.5 w-2.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
            </span>
            <h1 class="font-gaming font-black text-xs tracking-wider text-white">MR. HKT <span class="text-accent">ESPORTS</span></h1>
        </div>
        <div id="user-wallet-badge" onclick="switchNavigationTabPanelContext('panel-wallet')" class="bg-darkbg/90 border border-borderline px-3.5 py-1.5 rounded-full flex items-center gap-2 text-xs font-bold cursor-pointer">
            <i class="fa-solid fa-wallet text-accent"></i>
            <span class="font-mono">৳<span id="header-balance">0.00</span></span>
        </div>
    </header>

    <div class="bg-accent/10 border-b border-borderline py-2 px-4 flex items-center gap-2 text-xs font-semibold text-accent">
        <i class="fa-solid fa-bullhorn text-xs shrink-0"></i>
        <marquee id="dashboard-marquee-node" class="text-slate-300 font-medium" scrollamount="4">Welcome to Mr. HKT Esports Gateway.</marquee>
    </div>

    <main class="p-4 flex-grow">
        <section id="panel-home" class="app-panel-view flex flex-col gap-4">
            <div id="matches-list-container" class="flex flex-col gap-4">
                <div class="text-center py-16 text-slate-500 text-xs font-bold">
                    <i class="fa-solid fa-circle-notch animate-spin text-accent text-2xl mb-2"></i>
                    <p>Loading Tournaments...</p>
                </div>
            </div>
        </section>

        <section id="panel-wallet" class="app-panel-view hidden flex flex-col gap-4">
            <div class="grid grid-cols-2 gap-3 text-center">
                <div class="bg-cardbg border border-borderline p-4 rounded-2xl glass-panel">
                    <span class="text-[10px] uppercase font-bold text-slate-400">Deposit Balance</span>
                    <span class="font-gaming text-xl font-black text-white mt-1 block">৳<span id="wallet-deposit-balance">0.00</span></span>
                </div>
                <div class="bg-cardbg border border-borderline p-4 rounded-2xl glass-panel">
                    <span class="text-[10px] uppercase font-bold text-slate-400">Winning Ledger</span>
                    <span class="font-gaming text-xl font-black text-accent mt-1 block">৳<span id="wallet-winning-balance">0.00</span></span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="openWalletTransactionForm('deposit')" class="bg-emerald-600/15 text-emerald-400 border border-emerald-500/30 p-3.5 rounded-xl font-bold text-xs uppercase">Add Money</button>
                <button onclick="openWalletTransactionForm('withdraw')" class="bg-rose-600/15 text-rose-400 border border-rose-500/30 p-3.5 rounded-xl font-bold text-xs uppercase">Withdraw</button>
            </div>

            <div id="wallet-subview-form" class="bg-cardbg border border-borderline rounded-2xl p-4 hidden flex flex-col gap-3 text-xs font-semibold">
                <h3 id="form-tx-title" class="font-gaming font-bold uppercase text-white">Initiate Request</h3>
                <div class="flex gap-2">
                    <button type="button" onclick="selectPaymentChannel('bkash')" id="btn-pay-bkash" class="flex-1 border border-borderline bg-darkbg p-3 rounded-xl font-bold text-xs">bKash</button>
                    <button type="button" onclick="selectPaymentChannel('nagad')" id="btn-pay-nagad" class="flex-1 border border-borderline bg-darkbg p-3 rounded-xl font-bold text-xs">Nagad</button>
                </div>
                <input type="number" id="tx-amount-input" placeholder="Enter Amount (৳)" class="w-full bg-darkbg border border-borderline rounded-xl p-3 text-white focus:outline-none">
                <input type="text" id="tx-phone-input" placeholder="Your Mobile Number" class="w-full bg-darkbg border border-borderline rounded-xl p-3 text-white focus:outline-none">
                <input type="text" id="tx-trxid-input" placeholder="TrxID (Transaction Key)" class="w-full bg-darkbg border border-borderline rounded-xl p-3 text-white focus:outline-none font-mono">
                <button onclick="submitWalletTransactionPayload()" class="w-full bg-emerald-600 text-white p-3.5 rounded-xl font-bold uppercase">Submit Transaction</button>
            </div>
        </section>

        <section id="panel-profile" class="app-panel-view hidden flex flex-col gap-4">
            <div class="bg-cardbg border border-borderline rounded-2xl p-5 flex flex-col gap-4 glass-panel">
                <div class="flex items-center gap-4 border-b border-borderline pb-4">
                    <div class="w-12 h-12 rounded-xl bg-accent/10 border border-accent/30 text-accent flex items-center justify-center text-xl font-bold">
                        <i class="fa-solid fa-user-ninja"></i>
                    </div>
                    <div>
                        <h3 id="profile-meta-name" class="font-gaming text-sm font-bold text-white">Soldier Name</h3>
                        <p id="profile-meta-email" class="text-xs text-slate-400 font-mono">user@example.com</p>
                    </div>
                </div>
                <button onclick="handleUserSignOut()" class="w-full bg-rose-600/10 border border-rose-500/30 text-rose-400 p-3.5 rounded-xl font-bold text-xs uppercase">
                    Sign Out Profile
                </button>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-cardbg/90 backdrop-blur-lg border-t border-borderline p-2 flex justify-around z-40">
        <button onclick="switchNavigationTabPanelContext('panel-home')" id="nav-btn-home" class="nav-btn-active flex-1 py-2.5 rounded-xl flex flex-col items-center gap-1 text-[10px] font-bold uppercase">
            <i class="fa-solid fa-gamepad text-base"></i>
            <span>Matches</span>
        </button>
        <button onclick="switchNavigationTabPanelContext('panel-wallet')" id="nav-btn-wallet" class="flex-1 py-2.5 rounded-xl flex flex-col items-center gap-1 text-[10px] font-bold uppercase text-slate-400">
            <i class="fa-solid fa-wallet text-base"></i>
            <span>Wallet</span>
        </button>
        <button onclick="switchNavigationTabPanelContext('panel-profile')" id="nav-btn-profile" class="flex-1 py-2.5 rounded-xl flex flex-col items-center gap-1 text-[10px] font-bold uppercase text-slate-400">
            <i class="fa-solid fa-user-gear text-base"></i>
            <span>Profile</span>
        </button>
    </nav>

    <script type="module" src="script.js"></script>
</body>
</html>
